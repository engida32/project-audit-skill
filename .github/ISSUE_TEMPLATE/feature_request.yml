name: Feature request
description: Propose a change to the skill, validator, installer, or documentation.
title: "feat: "
labels: ["enhancement", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        Start with the problem. Read
        [CONTRIBUTING.md](https://github.com/engida32/project-audit-skill/blob/main/CONTRIBUTING.md)
        before proposing changes to behavior or safety gates.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What is missing, hard, or surprising today? Who hits it?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed change
      description: What should happen instead? Keep it as small as the problem allows.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: What else did you try or reject, and why?
    validations:
      required: false
  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: I searched existing issues and pull requests for this idea.
          required: true
