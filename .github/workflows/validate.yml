name: validate

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Validate skill
        run: python3 scripts/validate_skill.py skills/project-audit
      - name: Run unit tests
        run: python3 -m unittest discover -s tests -v
      - name: Compile Python files
        run: python3 -m py_compile scripts/validate_skill.py tests/test_validate_skill.py tests/test_install.py
      - name: Check installer syntax
        run: bash -n install.sh
      - name: Installer smoke test
        run: |
          tmp="$(mktemp -d)"
          trap 'rm -rf "$tmp"' EXIT
          sh install.sh "$tmp/skills"
          test -f "$tmp/skills/project-audit/SKILL.md"
