name: validate

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate skill
        run: python3 scripts/validate_skill.py skills/project-audit
      - name: Run tests
        run: python3 -m unittest discover -s tests -v
      - name: Compile scripts
        run: python3 -m py_compile scripts/validate_skill.py tests/test_validate_skill.py
